# The action gateway's Kubernetes identity (P5-05). Every tool call, dry runs included, runs as this
# ServiceAccount, so the gateway can do only what is listed here: Deployments and ConfigMaps in the dev,
# staging and prod namespaces, and nothing anywhere else. The Helm chart (P5-10) will template these
# objects and add the owner and session labels.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: action-gateway
  namespace: action-gateway
  labels: {app: ai-platform, layer: "05"}
---
# Read each target namespace's env label, which the policy checks. Namespaces are cluster-wide objects,
# so this is a ClusterRole, limited by name to the three namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: action-gateway-namespaces
  labels: {app: ai-platform, layer: "05"}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [dev, staging, prod]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: action-gateway-namespaces
  labels: {app: ai-platform, layer: "05"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: action-gateway-namespaces}
subjects:
  - {kind: ServiceAccount, name: action-gateway, namespace: action-gateway}
---
# What the tools do. The rules are written once here; only the RoleBindings below grant them, and only
# inside dev, staging and prod.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: action-gateway-actions
  labels: {app: ai-platform, layer: "05"}
rules:
  # get, list: status and snapshots; patch: scale, restart, rollout undo, apply, undo;
  # create: applying a new one; delete: undo of an action that created one
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, patch, create, delete]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [list]  # rollout_undo finds the previous revision
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list]  # blast radius and get_status
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: action-gateway
  namespace: dev
  labels: {app: ai-platform, layer: "05"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: action-gateway-actions}
subjects:
  - {kind: ServiceAccount, name: action-gateway, namespace: action-gateway}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: action-gateway
  namespace: staging
  labels: {app: ai-platform, layer: "05"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: action-gateway-actions}
subjects:
  - {kind: ServiceAccount, name: action-gateway, namespace: action-gateway}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: action-gateway
  namespace: prod
  labels: {app: ai-platform, layer: "05"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: action-gateway-actions}
subjects:
  - {kind: ServiceAccount, name: action-gateway, namespace: action-gateway}
