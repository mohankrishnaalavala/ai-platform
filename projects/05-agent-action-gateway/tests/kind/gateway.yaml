# kind smoke test only: the action gateway pod as the Helm chart (later) will run it. One replica, its own
# ServiceAccount, the MCP server and OPA both on 127.0.0.1 (no Service: reached only through kubectl
# port-forward), a read-only root filesystem, the local audit file and pending approvals in /data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: action-gateway
  namespace: action-gateway
  labels: {app: ai-platform, layer: "05"}
spec:
  replicas: 1
  strategy: {type: Recreate}  # one server at a time: pending approvals live in the pod
  selector: {matchLabels: {app.kubernetes.io/name: action-gateway}}
  template:
    metadata:
      labels: {app: ai-platform, layer: "05", app.kubernetes.io/name: action-gateway}
    spec:
      serviceAccountName: action-gateway
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: action-gateway:ci
          imagePullPolicy: Never  # kind-smoke.sh loads it into the cluster
          env:
            - {name: TOKENS_FILE, value: /etc/action-gateway/tokens.json}
            # Tests only, never in the Helm chart: a fixed weekday time, so the weekend prod freeze can't
            # change the smoke test's answers. The agent can't reach this file.
            - {name: TEST_ONLY_CLOCK_FILE, value: /etc/test-clock/now}
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 256Mi}}
          securityContext: &hardened {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tokens, mountPath: /etc/action-gateway, readOnly: true}
            - {name: test-clock, mountPath: /etc/test-clock, readOnly: true}
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        - name: opa
          image: openpolicyagent/opa:1.21.1@sha256:d3a9a6bd4fbcb0f4403294b0d0b239b07be163ac118a46df7d50045b52e52053
          # --ignore=.* skips the ConfigMap volume's hidden ..data folders, so each policy loads once
          args: [run, --server, --addr=127.0.0.1:8181, --skip-version-check, --log-level=error, --ignore=.*, /policies]
          resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: *hardened
          volumeMounts:
            - {name: policies, mountPath: /policies, readOnly: true}
      volumes:
        - {name: tokens, configMap: {name: agent-tokens}}
        - {name: test-clock, configMap: {name: test-clock}}
        - {name: policies, configMap: {name: policies}}
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
