{{- if .Values.secrets.csi }}
# The GKE Secret Manager add-on mounts these as files in /secrets, read with the pod's own Workload
# Identity (foundation IAM: the action-gateway KSA may read these three secrets only). The Slack tokens are
# mounted only with the Slack approver.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: action-gateway-secrets
  labels: {{- include "ag.labels" . | trim | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- include "ag.secret" (dict "project" .Values.project "name" "action-gateway-team-key") | nindent 6 }}
      {{- if eq .Values.approver "slack" }}
      {{- include "ag.secret" (dict "project" .Values.project "name" "slack-app-token") | nindent 6 }}
      {{- include "ag.secret" (dict "project" .Values.project "name" "slack-bot-token") | nindent 6 }}
      {{- end }}
{{- end }}
