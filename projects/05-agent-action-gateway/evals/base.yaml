          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "checkout",
        "namespace": "prod",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
