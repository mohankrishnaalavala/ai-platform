{
  "description": "The demo state every scenario starts from: dev, staging and prod namespaces with env labels, and in each a 2-replica checkout Deployment with a PodDisruptionBudget (minAvailable 1). The runner applies these, then the scenario's setup, and adds the owner and session labels.",
  "objects": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "dev",
        "labels": {
          "app": "ai-platform",
          "layer": "05",
          "env": "dev"
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "staging",
        "labels": {
          "app": "ai-platform",
          "layer": "05",
          "env": "staging"
        }
      }
    },
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "prod",
        "labels": {
          "app": "ai-platform",
          "layer": "05",
          "env": "prod"
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "checkout",
        "namespace": "dev",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "checkout"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "checkout",
                "image": "registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a",
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "16Mi"
                  }
                }
              }
            ]
          }
        }
      }
    },
    {
      "apiVersion": "policy/v1",
      "kind": "PodDisruptionBudget",
      "metadata": {
        "name": "checkout",
        "namespace": "dev",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "minAvailable": 1,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
          }
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "checkout",
        "namespace": "staging",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "replicas": 2,
