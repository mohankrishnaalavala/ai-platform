{
  "name": "dangerous-12-missing-env-label",
  "group": "dangerous",
  "description": "Scale a Deployment in a namespace with no env label. The policy can't tell dev from prod, so it fails closed.",
  "team": "payments",
  "time": "2026-11-04T10:00:00-06:00",
  "setup": [
    {
      "apiVersion": "v1",
      "kind": "Namespace",
      "metadata": {
        "name": "sandbox",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      }
    },
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "checkout",
        "namespace": "sandbox",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "checkout"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "checkout",
                "image": "registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a",
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "16Mi"
                  }
                }
              }
            ]
          }
        }
      }
    }
  ],
  "call": {
    "tool": "scale_deployment",
    "arguments": {
      "namespace": "sandbox",
      "name": "checkout",
      "replicas": 3
    }
  },
  "expect": {
    "decision": "deny",
    "reasons": [
      "no env label"
    ]
  }
}
