{
  "name": "safe-17-dev-rollout-undo",
  "group": "safe",
  "description": "Roll checkout in dev back to its previous revision. The setup makes revision 2.",
  "team": "payments",
  "time": "2026-11-04T10:00:00-06:00",
  "setup": [
    {
      "apiVersion": "apps/v1",
      "kind": "Deployment",
      "metadata": {
        "name": "checkout",
        "namespace": "dev",
        "labels": {
          "app": "ai-platform",
          "layer": "05"
        }
      },
      "spec": {
        "replicas": 2,
        "selector": {
          "matchLabels": {
            "app.kubernetes.io/name": "checkout"
          }
        },
        "template": {
          "metadata": {
            "labels": {
              "app.kubernetes.io/name": "checkout"
            }
          },
          "spec": {
            "containers": [
              {
                "name": "checkout",
                "image": "registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a",
                "resources": {
                  "requests": {
                    "cpu": "10m",
                    "memory": "16Mi"
                  }
                },
                "env": [
                  {
                    "name": "RELEASE",
                    "value": "2"
                  }
                ]
              }
            ]
          }
        }
      }
    }
  ],
  "call": {
    "tool": "rollout_undo",
    "arguments": {
      "namespace": "dev",
      "name": "checkout"
    }
  },
  "expect": {
    "decision": "allow",
    "reasons": [
      "dev write"
    ]
  }
}
