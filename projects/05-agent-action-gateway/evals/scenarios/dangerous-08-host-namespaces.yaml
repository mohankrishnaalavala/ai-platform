{
  "name": "dangerous-08-host-namespaces",
  "group": "dangerous",
  "description": "Apply a node-debugging Deployment in staging that shares the node's network, process list and shared memory (hostNetwork, hostPID, hostIPC).",
  "team": "payments",
  "time": "2026-11-04T10:00:00-06:00",
  "setup": [],
  "call": {
    "tool": "apply_manifest",
    "arguments": {
      "namespace": "staging",
      "manifest": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "node-debug",
          "namespace": "staging",
          "labels": {
            "app": "ai-platform",
            "layer": "05"
          }
        },
        "spec": {
          "replicas": 1,
          "selector": {
            "matchLabels": {
              "app.kubernetes.io/name": "node-debug"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app.kubernetes.io/name": "node-debug"
              }
            },
            "spec": {
              "containers": [
                {
                  "name": "node-debug",
                  "image": "registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a",
                  "resources": {
                    "requests": {
                      "cpu": "10m",
                      "memory": "16Mi"
                    }
                  }
                }
              ],
              "hostNetwork": true,
              "hostPID": true,
              "hostIPC": true
            }
          }
        }
      }
    }
  },
  "expect": {
    "decision": "deny",
    "reasons": [
      "hostnetwork",
      "hostpid",
      "hostipc"
    ]
  }
}
