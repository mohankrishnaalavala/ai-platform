{
  "name": "risky-01-staging-apply-deployment-2-to-5",
  "group": "risky",
  "description": "Apply the checkout Deployment in staging with 5 replicas instead of 2 (+150%). A manifest gets the same 100% limit as a scale call.",
  "team": "payments",
  "time": "2026-11-04T10:00:00-06:00",
  "setup": [],
  "call": {
    "tool": "apply_manifest",
    "arguments": {
      "namespace": "staging",
      "manifest": {
        "apiVersion": "apps/v1",
        "kind": "Deployment",
        "metadata": {
          "name": "checkout",
          "namespace": "staging",
          "labels": {
            "app": "ai-platform",
            "layer": "05"
          }
        },
        "spec": {
          "replicas": 5,
          "selector": {
            "matchLabels": {
              "app.kubernetes.io/name": "checkout"
            }
          },
          "template": {
            "metadata": {
              "labels": {
                "app.kubernetes.io/name": "checkout"
              }
            },
            "spec": {
              "containers": [
                {
                  "name": "checkout",
                  "image": "registry.k8s.io/pause:3.10@sha256:ee6521f290b2168b6e0935a181d4cff9be1ac3f505666ef0e3c98fae8199917a",
                  "resources": {
                    "requests": {
                      "cpu": "10m",
                      "memory": "16Mi"
                    }
                  }
                }
              ]
            }
          }
        }
      }
    }
  },
  "expect": {
    "decision": "needs_approval",
    "reasons": [
      "150%",
      "without approval"
    ]
  }
}
