# Game day experiment 3 (gameday.sh applies it, then deletes it): the gateway may reach pods in the cluster
# and DNS only, so its calls to the hosted model on Vertex AI fail, and so does the metadata server its
# keyless login uses. Dataplane V2 enforces it (it drops packets, it doesn't refuse them). owner and session
# labels come from gameday.sh.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-hosted-model
  namespace: gateway
  labels: {app: ai-platform, layer: "03"}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: litellm}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}  # every pod in the cluster: vLLM, Postgres, Presidio, the collector
    - ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
