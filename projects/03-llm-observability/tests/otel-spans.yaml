# CI only: P2's collector config (projects/02-llm-gateway/tests/otel-ci.yaml) plus a file exporter, so
# test_spans.py can read every span as JSON. compose.spans.yaml swaps it in for P2's file.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: detailed  # P2's PII check reads these from the container log
  file:
    path: /spans/spans.jsonl
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug, file]
