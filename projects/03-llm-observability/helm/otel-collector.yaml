# P3's values on top of P2's (projects/02-llm-gateway/helm/otel-collector.yaml): the same release. Traces
# go on to Tempo, and the span_metrics connector (alpha in 0.161.0) turns them into request, error and
# latency metrics, which Prometheus scrapes from port 8889 (ServiceMonitor below).
# The sum connector adds cost per team and per model. Extra labels: model group, team and status code
# only (tests/test_spans.py shows where each comes from).
# Anything per user or per prompt would make Prometheus huge. owner and session labels come from deploy.sh.
ports:
  span-metrics:
    enabled: true
    containerPort: 8889
    servicePort: 8889
    protocol: TCP
serviceMonitor:
  enabled: true
  metricsEndpoints:
    - port: span-metrics
      interval: 15s
  # No extraLabels: the chart already puts P2's labels (app, layer, owner, session) on it.
config:
  exporters:
    otlp_http/tempo:
      endpoint: http://tempo.monitoring:4318
    prometheus:
      endpoint: ${env:MY_POD_IP}:8889
  connectors:
    span_metrics:
      metrics_flush_interval: 15s  # the default 60 s would add up to a minute to every alert
      histogram:
        unit: s
        explicit:
          # 2.5 s is the latency SLO's threshold and 10 s and 30 s are chat-default's timeouts: the SLO
          # math is exact only at a bucket boundary.
          buckets: [100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s, 60s]
      # The connector's default collector.instance.id (a UUID per collector process) would split every
      # series on each restart; one collector replica doesn't need it.
      exclude_dimensions: [collector.instance.id]
      dimensions:
        - name: litellm.model_group
        - name: metadata.user_api_key_team_alias
        - name: http.response.status_code
    # Cost per team (P3-05): each model try's cost (gen_ai.cost.total_cost, the price the spend logs use)
    # and output tokens, summed from litellm_request spans. One attribute per metric: in 0.161.0 the sum
    # connector adds a value once per attribute (connector/sumconnector/sum.go, increment), so two would
    # double it. tests/test_cost.py checks the totals against the spend logs.
    sum:
      spans:
        llm.cost.by_team:
          source_attribute: gen_ai.cost.total_cost
          conditions: ['span.name == "litellm_request"']
          attributes: [{key: metadata.user_api_key_team_alias}]
        llm.cost.by_model:
          source_attribute: gen_ai.cost.total_cost
          conditions: ['span.name == "litellm_request"']
          attributes: [{key: litellm.model_group}]
        llm.output_tokens.by_model:
          source_attribute: gen_ai.usage.output_tokens
          conditions: ['span.name == "litellm_request"']
          attributes: [{key: litellm.model_group}]
  processors:
    # The sum connector sends per-batch deltas with no start time, which the Prometheus exporter can't
    # add up (it keeps only the latest); this keeps running totals.
    deltatocumulative: {}
  service:
    pipelines:
      traces:
        exporters: [debug, otlp_http/tempo, span_metrics, sum]
      metrics:
        receivers: [span_metrics]
        processors: [memory_limiter, batch]
        exporters: [prometheus]
      metrics/cost:
        receivers: [sum]
        processors: [memory_limiter, deltatocumulative, batch]
        exporters: [prometheus]
