# The LLM gateway: LiteLLM in front of the self-hosted model (P1) and a hosted one, with Postgres
# for teams, keys and spend. deploy.sh sets project, labels.owner and labels.session.
project: ""  # the GCP project that holds the secrets and serves the hosted model

labels:
  app: ai-platform
  layer: "02"
  owner: ""
  session: ""

litellm:
  # Open-source features only; no license key is set anywhere (results/spike-2026-10-18.md).
  image: ghcr.io/berriai/litellm-database:v1.103.3@sha256:11f2537026988447f49c036bb692898b4ab697caa3b4a060bf6c668266b69659
  # Starting points: the shakedown measures what they really use on the one system node.
  resources:
    requests: {cpu: 500m, memory: 1Gi}
    limits: {memory: 1Gi}

postgres:
  image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 256Mi}

# Presidio (open-source PII detection), version 2.2.362: the newest on Microsoft's registry.
presidio:
  analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    startupSeconds: 600  # loads a language model: about a minute in the spike, once over 300 s
    resources:  # it holds a language model in memory; the shakedown measures the real use
      requests: {cpu: 500m, memory: 2Gi}
      limits: {memory: 2Gi}
  anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
    startupSeconds: 120  # no model; in CI its worker once never started (results/ci-gateway-2026-10-18.md)
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 256Mi}

# Test only (session PII tests): the mock provider as the alias chat-hosted-mock. deploy.sh turns it on
# with MOCK_PROVIDER=1; off for a real install.
mockProvider:
  enabled: false
  image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f

# Where the gateway sends its traces (the collector deploy.sh installs in this namespace).
otelEndpoint: http://otel-collector:4318/v1/traces

# LiteLLM's config file, as is. Secrets come from the environment (os.environ/...), which the
# container fills from the mounted Secret Manager files at start; nothing secret is in here.
config:
  model_list:
    - model_name: chat-default  # our vLLM (P1)
      litellm_params:
        model: openai/Qwen/Qwen2.5-7B-Instruct
        api_base: http://vllm.vllm.svc:8000/v1
        api_key: unused  # vLLM has no auth inside the cluster; the gateway is the front door
        # Fall back after 10 s without a first token (streaming) or 30 s in all. P1's BF16 run: chat
        # stays under both at every load (p99 TTFT up to 4.3 s and end-to-end up to 15.3 s, both at 32
        # concurrent). Rag is close at 8 (7.3 s and 29.0 s) and over them from 16 (32.5 s and 62.5 s),
        # where vLLM is already overloaded. Without a timeout, a dead upstream held requests past 60 s
        # (results/spike-2026-10-18.md).
        timeout: 30
        stream_timeout: 10
        # Internal price, so team budgets count self-hosted use too: P1's GPU-node cost per output
        # token, BF16, chat at 32 concurrent, on-demand node ($0.75 per 1M output tokens,
        # projects/01-gpu-serving/results/cost-2026-10-17.md). Input tokens are in that node cost.
        input_cost_per_token: 0
        output_cost_per_token: 0.00000075
    - model_name: chat-hosted  # the hosted model, keyless through Workload Identity
      litellm_params:
        model: vertex_ai/gemini-3.5-flash-lite
        vertex_project: os.environ/VERTEX_PROJECT
        vertex_location: global
  # Mask personal data in every request, not only the hosted route: a request that falls back from
  # chat-default to chat-hosted skips a guardrail scoped to chat-hosted (results/spike-2026-10-18.md).
  # The types are listed on purpose: with an explicit list, LiteLLM refuses a request when Presidio
  # answers with an error, instead of sending it unmasked.
  guardrails:
    - guardrail_name: mask-pii
      litellm_params:
        guardrail: presidio
        mode: pre_call
        default_on: true
        # Requests only. LiteLLM's default ("both") adds a second Presidio pass on every answer, and
        # that pass holds a stream back until the answer is done (session 3: TTFT = whole answer).
        presidio_filter_scope: input
        pii_entities_config:
          EMAIL_ADDRESS: MASK
          PHONE_NUMBER: MASK
          CREDIT_CARD: MASK
          PERSON: MASK
          US_SSN: MASK
          IBAN_CODE: MASK
          IP_ADDRESS: MASK
  router_settings:
    fallbacks: [{"chat-default": ["chat-hosted"]}]
    num_retries: 0  # straight to the fallback: a retry against a dead upstream only adds waiting
  litellm_settings:
    callbacks: ["otel"]
    turn_off_message_logging: true  # no prompt or answer text in logs, traces or spend logs
  general_settings:
    master_key: os.environ/LITELLM_MASTER_KEY
    database_url: os.environ/DATABASE_URL
