apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  labels: {{- include "gateway.labels" . | trim | nindent 4 }}
data:
  {{- $config := deepCopy .Values.config }}
  {{- $_ := set $config "model_list" (concat $config.model_list .Values.extraModels) }}
  {{- if .Values.mockProvider.enabled }}
  {{- $mock := dict "model_name" "chat-hosted-mock" "litellm_params" (dict "model" "openai/hosted-mock" "api_base" "http://mock-provider:8000/v1" "api_key" "unused") }}
  {{- $_ := set $config "model_list" (append $config.model_list $mock) }}
  {{- end }}
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
  # The add-on mounts secrets as files; LiteLLM reads them from the environment. Set them here, never
  # echo them, then run the image's own entrypoint. CI's containers run this same file.
  start.sh: |
    set -eu
    key=$(cat /secrets/litellm-master-key)
    pw=$(cat /secrets/gateway-postgres-password)
    export LITELLM_MASTER_KEY="$key" DATABASE_URL="postgresql://litellm:$pw@postgres:5432/litellm"
    exec docker/prod_entrypoint.sh --config /config/config.yaml --port 4000
