# The GKE Secret Manager add-on mounts these as files, read with each pod's own Workload Identity.
# Each pod gets only the secrets its Kubernetes service account may read (foundation IAM).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: litellm-secrets
  labels: {{- include "gateway.labels" . | trim | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- include "gateway.secret" (dict "project" .Values.project "name" "litellm-master-key") | nindent 6 }}
      {{- include "gateway.secret" (dict "project" .Values.project "name" "gateway-postgres-password") | nindent 6 }}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-secrets
  labels: {{- include "gateway.labels" . | trim | nindent 4 }}
spec:
  provider: gke
  parameters:
    secrets: |
      {{- include "gateway.secret" (dict "project" .Values.project "name" "gateway-postgres-password") | nindent 6 }}
