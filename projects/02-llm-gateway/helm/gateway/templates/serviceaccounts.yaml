# IAM grants go straight to these names (Workload Identity, foundation): litellm reads both secrets
# and may send prompt requests to Vertex AI; postgres reads only its password. No key anywhere.
{{- range list "litellm" "postgres" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels: {{- include "gateway.labels" $ | trim | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
