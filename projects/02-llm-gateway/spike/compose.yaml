# P2-01 spike: LiteLLM with Postgres, Presidio and an OTel collector, in front of two mock providers
# (one stands in for vLLM, one for Claude). No license key is set anywhere. Runs only in GitHub Actions
# (p2-spike.yml); nothing here touches GCP. MASTER_KEY, PG_PASSWORD and CONFIG come from the job.
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${PG_PASSWORD:?}
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "litellm"]
      interval: 2s
      retries: 30
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:2.2.362@sha256:286e3fa7f3a7426e775e8564fe1870f1ba8f999d3ab8bbb8cc46a44355d9d6e9
    ports: ["127.0.0.1:8103:3000"]  # only so check.py can wait for its language model to load
  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:2.2.362@sha256:a10a12a2a613d13cf29d3ad3641e3258444dd8c90403dd644a0a114c472c2483
  mock-vllm:
    image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
    command: ["python3", "/app/mock.py"]
    environment: {NAME: vllm}
    volumes: ["./mock.py:/app/mock.py:ro"]
    ports: ["127.0.0.1:8101:8000"]
  mock-hosted:
    image: python:3.13-slim@sha256:70729b46c69b4f1e97c4822c1af3df53a1476cf5ddc6c087c0c10bc3a5678c2f
    command: ["python3", "/app/mock.py"]
    environment: {NAME: hosted}
    volumes: ["./mock.py:/app/mock.py:ro"]
    ports: ["127.0.0.1:8102:8000"]
  otel:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    command: ["--config=/etc/otel.yaml"]
    volumes: ["./otel-config.yaml:/etc/otel.yaml:ro"]
  litellm:
    image: ghcr.io/berriai/litellm-database:v1.103.3@sha256:11f2537026988447f49c036bb692898b4ab697caa3b4a060bf6c668266b69659
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${MASTER_KEY:?}
      DATABASE_URL: postgresql://litellm:${PG_PASSWORD:?}@postgres:5432/litellm
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
      OTEL_EXPORTER: otlp_http
      OTEL_ENDPOINT: http://otel:4318/v1/traces
    volumes: ["./${CONFIG:?}:/app/config.yaml:ro"]
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      postgres: {condition: service_healthy}
      presidio-analyzer: {condition: service_started}
      presidio-anonymizer: {condition: service_started}
      otel: {condition: service_started}
