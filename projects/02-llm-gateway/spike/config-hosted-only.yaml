# Spike variant "hosted-only": Presidio runs only for chat-hosted, through a policy attached to that
# model (config-level, not per key or team). The question: does a chat-default request that falls back
# to chat-hosted get masked too? Same models as config-all.yaml.
model_list:
  - model_name: chat-default
    litellm_params:
      model: openai/qwen
      api_base: http://mock-vllm:8000/v1
      api_key: unused
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0001
  - model_name: chat-hosted
    litellm_params:
      model: openai/claude
      api_base: http://mock-hosted:8000/v1
      api_key: unused
      input_cost_per_token: 0.0001
      output_cost_per_token: 0.0001

router_settings:
  fallbacks: [{"chat-default": ["chat-hosted"]}]
  num_retries: 0

guardrails:
  - guardrail_name: mask-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      default_on: false

policies:
  mask-hosted:
    guardrails:
      add: [mask-pii]

policy_attachments:
  - policy: mask-hosted
    models: [chat-hosted]

litellm_settings:
  callbacks: ["otel"]
  turn_off_message_logging: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  proxy_batch_write_at: 1
