# CI's collector (tests/compose.yaml): OTLP over HTTP in, every span printed in full, so test_pii.py
# can check that no span carries prompt text. (The cluster's collector prints a one-line summary.)
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
