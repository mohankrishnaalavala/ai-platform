{{- $gcs := eq .Values.weightsSource "gcs" }}
{{- if not (has .Values.weightsSource (list "gcs" "hf")) }}{{ fail "weightsSource must be gcs or hf" }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  labels: {{- include "vllm.labels" . | trim | nindent 4 }}
    app.kubernetes.io/name: vllm
    model-config: {{ required "name (from the model config) is required" .Values.name | quote }}
spec:
  # No replicas field: KEDA owns the count. Recreate, because a rolling update would wait for a
  # second GPU that the quota doesn't allow.
  strategy:
    type: Recreate
  # A cold GPU node, the image and 15 GB of weights can take longer than the default 10 minutes.
  # Longer than deploy.sh's 40-minute wait, so that wait reports the timeout.
  progressDeadlineSeconds: 2700
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  template:
    metadata:
      labels: {{- include "vllm.labels" . | trim | nindent 8 }}
        app.kubernetes.io/name: vllm
        model-config: {{ .Values.name | quote }}
      {{- if $gcs }}
      annotations:
        gke-gcsfuse/volumes: "true"
        # No caps on the Cloud Storage FUSE sidecar: it caches the 15 GB of weights while vLLM loads them.
        gke-gcsfuse/cpu-limit: "0"
        gke-gcsfuse/memory-limit: "0"
        gke-gcsfuse/ephemeral-storage-limit: "0"
      {{- end }}
    spec:
      serviceAccountName: vllm
      # Kubernetes would set VLLM_PORT=tcp://... for the Service named vllm, and vLLM reads
      # VLLM_PORT as its own setting and refuses to start. Same in every pod that runs vLLM code.
      enableServiceLinks: false
      # Both GPU pools look alike to the autoscaler, so the pod names its pool.
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ .Values.nodePool }}
        cloud.google.com/gke-accelerator: {{ .Values.gpu }}
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: "{{ required "registry is required" .Values.registry }}/{{ base .Values.image.repository }}@{{ required "image.digest is required" .Values.image.digest }}"
          command: ["vllm", "serve"]
          # vLLM v0.30.0 doesn't log request contents unless --enable-log-requests is set.
          args:
            {{- if $gcs }}
            - /models
            {{- else }}
            - {{ required "model.hfId is required" .Values.model.hfId }}
            - --revision={{ required "model.revision is required" .Values.model.revision }}
            {{- end }}
            # Two names. The model's own comes first: vLLM's answers and metrics show it, and P1's bench calls it.
            # The gateway's chat-default calls the fixed second one, so a model swap needs no gateway change.
            - --served-model-name
            - {{ .Values.model.hfId }}
            - self-hosted
            - --max-model-len={{ .Values.vllm.maxModelLen }}
            - --gpu-memory-utilization={{ .Values.vllm.gpuMemoryUtilization }}
            {{- with .Values.vllm.quantization }}
            - --quantization={{ . }}
            {{- end }}
            {{- with .Values.vllm.defaultChatTemplateKwargs }}
            - {{ printf "--default-chat-template-kwargs=%s" (toJson .) | quote }}
            {{- end }}
            - --port=8000
          env:
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: DO_NOT_TRACK
              value: "1"
            {{- if $gcs }}
            - name: HF_HUB_OFFLINE
              value: "1"
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
          # Ready once the model is loaded. No liveness probe: loading takes minutes.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            # vLLM's processes talk through shared memory; the container default is 64 MB.
            - name: shm
              mountPath: /dev/shm
            - name: models
              mountPath: {{ if $gcs }}/models{{ else }}/root/.cache/huggingface{{ end }}
              readOnly: {{ $gcs }}
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: models
          {{- if $gcs }}
          csi:
            driver: gcsfuse.csi.storage.gke.io
            readOnly: true
            volumeAttributes:
              bucketName: {{ required "modelsBucket is required" .Values.modelsBucket }}
              mountOptions: "implicit-dirs,only-dir={{ required "model.bucketPath is required" .Values.model.bucketPath }},file-cache:max-size-mb:-1,file-cache:cache-file-for-range-read:true,file-cache:enable-parallel-downloads:true,metadata-cache:ttl-secs:-1"
          {{- else }}
          emptyDir: {}
          {{- end }}
