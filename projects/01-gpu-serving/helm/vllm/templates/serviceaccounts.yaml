# IAM grants go straight to these names (Workload Identity): vllm reads the models bucket,
# bench may only add files to the results bucket. No Google service account, no key.
{{- range list "vllm" "bench" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ . }}
  labels: {{- include "vllm.labels" $ | trim | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
