# One-time copy, as the mirror service account: the pinned vLLM image from Docker Hub into Artifact
# Registry, and the model weights from Hugging Face into the models bucket. Nothing large goes
# through a laptop. Runs from main only (the WIF provider trusts no other branch). Safe to re-run:
# files already in the bucket are skipped, and the mirror account can't overwrite or delete.
# Also, on each push to main that changes it, P5's action gateway image: built here and pushed to
# Artifact Registry (job action-gateway-image).
name: mirror

on:
  workflow_dispatch:
    inputs:
      config:
        description: Model config whose image and weights to copy
        default: config/models/qwen2.5-7b-bf16.yaml
  push:
    branches: [main]
    paths:
      - projects/05-agent-action-gateway/Dockerfile
      - projects/05-agent-action-gateway/requirements.txt
      - projects/05-agent-action-gateway/src/**
      - .github/workflows/mirror.yml

permissions:
  contents: read
  id-token: write

# Two copies at once would only download everything twice.
concurrency:
  group: mirror
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  mirror:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      CONFIG: ${{ inputs.config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: check the config
        run: |
          [[ "$CONFIG" =~ ^config/models/[a-z0-9.-]+\.yaml$ && -f "$CONFIG" ]] || { echo "config must be a file in config/models/"; exit 1; }
          [[ "$(yq '.image.digest' "$CONFIG")" =~ ^sha256:[0-9a-f]{64}$ && "$(yq '.model.revision' "$CONFIG")" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "the config must pin the image by digest and the model by commit"; exit 1; }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: mirror@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 587.0.0

      - name: install crane
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tgz" https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          echo "0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0  $RUNNER_TEMP/crane.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tgz" -C "$RUNNER_TEMP" crane

      # Registry to registry: the layers stream through the runner, nothing is stored on its disk.
      - name: copy the image
        run: |
          repo=$(yq '.image.repository' "$CONFIG"); tag=$(yq '.image.tag' "$CONFIG"); digest=$(yq '.image.digest' "$CONFIG")
          dest="us-central1-docker.pkg.dev/$PROJECT_ID/images/vllm-openai:$tag"
          gcloud auth print-access-token | "$RUNNER_TEMP/crane" auth login us-central1-docker.pkg.dev -u oauth2accesstoken --password-stdin
          "$RUNNER_TEMP/crane" copy "docker.io/$repo@$digest" "$dest"
          got=$("$RUNNER_TEMP/crane" digest "$dest")
          [ "$got" = "$digest" ] || { echo "copied image has digest $got, expected $digest"; exit 1; }
          echo "image copied, digest $got"

      # One file at a time: the runner's disk can't hold all the shards at once.
      - name: copy the weights
        run: |
          hf=$(yq '.model.hfId' "$CONFIG"); rev=$(yq '.model.revision' "$CONFIG")
          dest="gs://$PROJECT_ID-models/$(yq '.model.bucketPath' "$CONFIG")"
          files=$(curl -fsSL "https://huggingface.co/api/models/$hf/revision/$rev?blobs=true" | jq -r '.siblings[] | [.rfilename, (.lfs.sha256 // "-")] | @tsv')
          [ -n "$files" ] || { echo "Hugging Face listed no files for $hf at $rev"; exit 1; }
          have=$(gcloud storage ls "$dest/**" 2>/dev/null || true)
          # </dev/null: commands inside the loop must not read the remaining file lines.
          while IFS=$'\t' read -r f sha; do
            if grep -qxF "$dest/$f" <<< "$have"; then echo "$f: already copied"; continue; fi
            curl -fsSL --retry 5 -o "$RUNNER_TEMP/file" "https://huggingface.co/$hf/resolve/$rev/$f" </dev/null
            # Weight shards are checked by sha256; small files rely on the pinned commit and HTTPS.
            [ "$sha" = - ] || echo "$sha  $RUNNER_TEMP/file" | sha256sum -c --quiet -
            gcloud storage cp --no-clobber "$RUNNER_TEMP/file" "$dest/$f" </dev/null
            rm "$RUNNER_TEMP/file"
            echo "$f: copied"
          done <<< "$files"
          want=$(wc -l <<< "$files"); got=$(gcloud storage ls "$dest/**" | wc -l)
          [ "$got" -eq "$want" ] || { echo "bucket has $got files, expected $want"; exit 1; }
          echo "weights copied: $got files"

  # P5: the action gateway image from main, from the same Dockerfile CI built and scanned on the pull request
  # (base image pinned by digest, every Python package by hash). Tagged with the commit and "main"; P5's
  # deploy.sh reads the digest that "main" points at, so the pod runs the image pinned by digest. Session
  # nodes pull it with the reader role they already have.
  action-gateway-image:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: mirror@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 587.0.0

      - name: build and push the action gateway image
        working-directory: projects/05-agent-action-gateway
        run: |
          repo="us-central1-docker.pkg.dev/$PROJECT_ID/images/action-gateway"
          docker build -t "$repo:$GITHUB_SHA" -t "$repo:main" .
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker push "$repo:$GITHUB_SHA"
          docker push "$repo:main"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$repo:$GITHUB_SHA")
          [[ "$digest" == "$repo@sha256:"* ]] || { echo "no digest for the pushed image ($digest)"; exit 1; }
          echo "pushed ${digest#*@} as action-gateway:$GITHUB_SHA and :main" | tee -a "$GITHUB_STEP_SUMMARY"
