# Manual session, as the deployer service account: make up (cluster, NAT, P1 layer) -> tests and
# measurements -> raw diagnostics; then a separate teardown job: make down -> make status.
# Runs from main only: the WIF provider trusts no other branch.
#   shakedown: smoke tests, one short benchmark and one node-removal timing (estimate: 1-1.5 h)
#   full:      every benchmark (BF16 and FP8), the scale-out test, 3+3 cold starts (estimate: 3.5-5 h)
#   bf16-bench: only the BF16 benchmarks, to redo a run that was invalid (estimate: 1-1.5 h)
#   gateway-shakedown: P2 only, no GPU: the gateway with the test-only mock, make test P=02 (estimate: 45-75 min)
#   gateway-full: P1 (FP8) and P2: make test P=02, the demo transcript, the gateway-overhead benchmark (3 rounds),
#     then fallback after vLLM goes away and the demo's 20 calls (estimate: 1.5-2 h; at most 165 + 45 min of
#     cluster time from the two jobs' limits, about $4.40 at on-demand list prices)
#   obs-shakedown: P2 and P3, no vLLM: make test P=03, a short spot GPU check that Prometheus gets GKE's DCGM
#     GPU metrics (then the GPU pool goes to 0), and the fallback alert end to end (estimate: about 70 min of
#     cluster time, about $0.70; at most 85 + 45 min, about $1.23 with NAT data and the GKE fee, see PR #50)
#   obs-full: P1 (FP8, on-demand GPU), P2 and P3: make test P=03 with the vLLM metric names, Grafana screenshots,
#     the game day, then scale from zero; results uploaded, then the GPU pool to 0 (estimate: about 2.8 h of
#     cluster time, about $3.20; at most 225 + 45 min, about $4.80 with NAT data and the GKE fee)
# Results go to the results bucket as each step finishes, so a run that ends early keeps them.
# Teardown is its own job with its own time limit, so it runs in full even after the session job
# fails, times out or is cancelled. cost-guard (nightly, clusters older than 8 h) is the backstop.
name: gpu-session
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [shakedown, full, bf16-bench, gateway-shakedown, gateway-full, obs-shakedown, obs-full]
        default: shakedown
      zone:
        description: Zone of the cluster (GPU nodes may start in any us-central1 zone with L4s)
        type: choice
        options: [us-central1-c, us-central1-a, us-central1-b]
        default: us-central1-c
      spot:
        description: Spot GPU nodes (cheaper); untick for on-demand (costs more; the L4 quota is 1 either way) if spot L4s run out in every zone
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

# cost-guard shares this group, so it never destroys a cluster a session is still using.
concurrency:
  group: session
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  session:
    runs-on: ubuntu-24.04
    # GitHub stops any job at 6 hours. Teardown runs in its own job afterwards.
    timeout-minutes: ${{ inputs.mode == 'full' && 350 || inputs.mode == 'gateway-shakedown' && 90 || inputs.mode == 'gateway-full' && 165 || inputs.mode == 'obs-shakedown' && 85 || inputs.mode == 'obs-full' && 225 || 150 }}
    outputs:
      started: ${{ steps.precheck.outputs.started }}
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      ZONE: ${{ inputs.zone }}
      BF16: config/models/qwen2.5-7b-bf16.yaml
      FP8: config/models/qwen2.5-7b-fp8.yaml
      # The full run's cold starts, obs-shakedown's GPU check and obs-full's scale from zero wait for idle GPU
      # nodes to go; this profile removes them sooner.
      PROFILE: ${{ (inputs.mode == 'full' || startsWith(inputs.mode, 'obs-')) && 'OPTIMIZE_UTILIZATION' || 'BALANCED' }}
      # obs-full is always on-demand (decision 3): a preemption mid-game-day would make its time to alert invalid.
      SPOT: ${{ inputs.mode == 'obs-full' && 'false' || inputs.spot }}
      # Every measurement ends by this many minutes after the job starts, leaving time for diagnostics.
      # obs-full: its steps after `make up` take about 115 min, up to about 130 (an estimate from the scripts' waits).
      MEASURE_MINUTES: ${{ inputs.mode == 'full' && 330 || inputs.mode == 'gateway-shakedown' && 75 || inputs.mode == 'gateway-full' && 145 || inputs.mode == 'obs-shakedown' && 70 || inputs.mode == 'obs-full' && 195 || 130 }}
      # P1 (vLLM), P2 (the gateway; with no GPU the GPU pool stays at 0 nodes), both, P2 and P3 (no vLLM), or all three.
      LAYERS: ${{ inputs.mode == 'gateway-shakedown' && '02' || inputs.mode == 'gateway-full' && '01 02' || inputs.mode == 'obs-shakedown' && '02 03' || inputs.mode == 'obs-full' && '01 02 03' || '01' }}
      TEST_P: ${{ startsWith(inputs.mode, 'gateway-') && '02' || startsWith(inputs.mode, 'obs-') && '03' || '01' }}
      MOCK_PROVIDER: ${{ startsWith(inputs.mode, 'gateway-') && '1' || '' }}  # P2's test-only mock, for the PII test
    steps:
      # `left` prints the seconds to the deadline, at least 1: `timeout 0` means no limit at all.
      - name: measurement deadline
        run: |
          echo "MEASURE_UNTIL=$(( $(date +%s) + MEASURE_MINUTES * 60 ))" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin" && echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # shellcheck disable=SC2016  # the script expands these when it runs, not now
          printf '%s\n' '#!/bin/bash' 'l=$(( MEASURE_UNTIL - $(date +%s) )); echo $(( l > 0 ? l : 1 ))' > "$RUNNER_TEMP/bin/left"
          chmod +x "$RUNNER_TEMP/bin/left"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 587.0.0
          install_components: gke-gcloud-auth-plugin

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: install helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      # The Makefile uses the `ai-platform` gcloud configuration, as on the laptop.
      - name: gcloud configuration
        run: |
          gcloud config configurations create ai-platform
          # kubectl's auth plugin needs an active account in this configuration, not just the
          # credential file override that the other gcloud commands use.
          gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud config set project "$PROJECT_ID"

      # A cluster that already exists belongs to someone else (e.g. a laptop session); leave it alone,
      # and tell teardown so (started=no). Any other outcome, including a failed lookup, makes teardown
      # run: when in doubt, the bill stops. So don't run a laptop session while this workflow runs.
      # (`timeout -k 30` below: SIGTERM at the deadline, SIGKILL 30 s later.)
      - name: stop if a cluster exists
        id: precheck
        run: |
          clusters=$(gcloud container clusters list --format='value(name)')
          if [ -n "$clusters" ]; then echo "started=no" >> "$GITHUB_OUTPUT"; echo "a session cluster already exists; not starting another"; exit 1; fi
          echo "started=yes" >> "$GITHUB_OUTPUT"

      # Cluster and NAT, then the layer: P1 (Prometheus, KEDA, vLLM BF16, until the model is loaded) or P2.
      - name: make up
        id: up
        timeout-minutes: 75
        # gateway-full and obs-full serve FP8 (faster: fewer requests reach the 10 s stream timeout at 50 concurrent).
        run: CONFIG=${{ (inputs.mode == 'gateway-full' || inputs.mode == 'obs-full') && '$FP8' || '' }} make up LAYERS="$LAYERS"

      # Each measuring step runs even if an earlier one failed (the run still ends red), and is cut off
      # at the deadline: `timeout` gets the seconds left from `left` (P3's session 2 on 2026-10-20 got
      # `timeout 0` on the deadline, so its game day ran on until the job was cancelled).
      - name: make test (P1 smoke tests and autoscaling path, every P2 check, or every P3 check)
        if: ${{ !cancelled() && steps.up.outcome == 'success' }}
        timeout-minutes: 30
        env:
          DASHBOARD_METRICS: "${{ inputs.mode == 'obs-full' && 'vllm: DCGM_' || '' }}"  # obs-full proves the vLLM and GPU metric names
        run: make test P="$TEST_P"

      # Printed for the blog's screenshots (no key is printed). Before the benchmark: it takes minutes.
      - name: "gateway-full: demo (a team, its budget, PII masked), printed for screenshots"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'gateway-full' }}
        run: timeout -k 30 "$(left)" bash projects/02-llm-gateway/tests/run.sh demo

      - name: "gateway-full: gateway overhead (the same load straight to vLLM and through the gateway, 3 rounds)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'gateway-full' }}
        run: CONFIG=$FP8 timeout -k 30 "$(left)" projects/02-llm-gateway/bench/overhead.sh

      # Last: it takes vLLM away (KEDA paused at 0 replicas).
      - name: "gateway-full: fallback after vLLM goes away"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'gateway-full' }}
        run: timeout -k 30 "$(left)" bash projects/02-llm-gateway/tests/run.sh vllm-down

      - name: "gateway-full: demo, 20 calls with vLLM gone"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'gateway-full' }}
        run: timeout -k 30 "$(left)" bash projects/02-llm-gateway/tests/run.sh demo vllm-down

      # The GPU's time in one short block: the check (at most 17 min, and cut at the deadline), then the pool
      # to 0 nodes however the check went. The job's limit (85 min) is past deadline + 10, so it can't land here.
      - name: "obs-shakedown: GPU check (a pause pod asks for one spot GPU; GKE's DCGM GPU metrics in Prometheus)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'obs-shakedown' }}
        run: timeout -k 30 "$(left)" bash projects/03-llm-observability/tests/run.sh gpu-check

      - name: "obs-shakedown: GPU pool to 0 nodes"
        if: ${{ always() && steps.up.outcome == 'success' && inputs.mode == 'obs-shakedown' }}
        timeout-minutes: 10
        run: |
          kubectl --kubeconfig "$HOME/.kube/ai-platform" delete pod gpu-check -n monitoring --ignore-not-found --wait=false
          gcloud container clusters resize ai-platform --location="$ZONE" --node-pool=gpu --num-nodes=0 --quiet

      # After the GPU is gone. With no vLLM every chat-default call falls back. Skipped until P3-06's alert
      # receiver exists.
      - name: "obs-shakedown: fallback alert end to end (time to alert, at most 15 min)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'obs-shakedown' }}
        run: timeout -k 30 "$(left)" bash projects/03-llm-observability/tests/run.sh fallback-alert

      # obs-full's results go to $RUNNER_TEMP/p3/<what>, uploaded together after scale from zero.
      - name: "obs-full: Grafana screenshots of the 3 dashboards under background load (decision 15)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'obs-full' }}
        run: OUT="$RUNNER_TEMP/p3/screenshots" timeout -k 30 "$(left)" projects/03-llm-observability/tests/screenshots.sh

      - name: "obs-full: game day (flood, vLLM killed, hosted model blocked; time to alert)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'obs-full' }}
        run: CONFIG=$FP8 OUT="$RUNNER_TEMP/p3/gameday" timeout -k 30 "$(left)" projects/03-llm-observability/tests/gameday/gameday.sh

      # After the game day: it needs no other chat-default traffic (the game day's load has stopped).
      - name: "obs-full: scale from zero on the gateway's traffic"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'obs-full' }}
        run: OUT="$RUNNER_TEMP/p3/scale-from-zero" timeout -k 30 "$(left)" projects/03-llm-observability/tests/scale_from_zero.sh

      # Text files get the project ID, number and emails taken out first; check the screenshots by eye before a post.
      - name: "obs-full: upload P3's results"
        if: ${{ always() && steps.up.outcome == 'success' && inputs.mode == 'obs-full' }}
        timeout-minutes: 5
        run: |
          session=$(gcloud container clusters describe ai-platform --location="$ZONE" --format='value(resourceLabels.session)')
          number=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          [ -n "$session" ] && [ -n "$number" ]
          for d in screenshots gameday scale-from-zero; do
            dir="$RUNNER_TEMP/p3/$d"
            [ -n "$(ls -A "$dir" 2>/dev/null)" ] || { echo "no $d results"; continue; }
            find "$dir" -type f ! -name '*.png' -exec sed -i -E "s/$PROJECT_ID/<project>/g; s/$number/<project-number>/g; s/[[:alnum:]._+-]+@[[:alnum:].-]+/<email>/g; s/sk-[[:alnum:]_.-]{4,}/sk-<redacted>/g" {} +
            GCS_TOKEN=$(gcloud auth print-access-token) python3 projects/01-gpu-serving/bench/upload.py \
              "gs://$PROJECT_ID-results/p3/obs-full/$session/$d" "$dir"/* || echo "upload $d failed"
          done

      - name: "shakedown: one short benchmark (BF16, chat, concurrency 8)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'shakedown' }}
        run: CONFIG=$BF16 SCENARIOS=chat CONCURRENCY=8 timeout -k 30 "$(left)" make bench

      - name: "shakedown: how long the idle GPU node takes to go"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'shakedown' }}
        run: CONFIG=$BF16 timeout -k 30 "$(left)" projects/01-gpu-serving/bench/coldstart.sh removal

      - name: "full or bf16-bench: BF16 benchmarks"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && (inputs.mode == 'full' || inputs.mode == 'bf16-bench') }}
        run: CONFIG=$BF16 timeout -k 30 "$(left)" make bench

      - name: "full: FP8 benchmarks"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'full' }}
        run: |
          CONFIG=$FP8 timeout -k 30 "$(left)" projects/01-gpu-serving/deploy.sh
          CONFIG=$FP8 timeout -k 30 "$(left)" make bench

      - name: "full: scale-out on queue pressure (FP8)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'full' }}
        run: CONFIG=$FP8 timeout -k 30 "$(left)" projects/01-gpu-serving/bench/scaleout.sh

      # Last: the longest steps, and baseline leaves the deployment on the baseline path.
      - name: "full: 3 optimized and 3 baseline cold starts (BF16)"
        if: ${{ !cancelled() && steps.up.outcome == 'success' && inputs.mode == 'full' }}
        run: |
          CONFIG=$BF16 timeout -k 30 "$(left)" projects/01-gpu-serving/deploy.sh
          CONFIG=$BF16 timeout -k 30 "$(left)" projects/01-gpu-serving/bench/coldstart.sh optimized 3
          CONFIG=$BF16 timeout -k 30 "$(left)" projects/01-gpu-serving/bench/coldstart.sh baseline 3

      # Raw cluster state for debugging, with the project ID, project number and emails taken out
      # (artifacts are visible to anyone who can see the repo). Bounded, so it can't hold up teardown.
      - name: diagnostics
        id: diag
        if: ${{ always() && steps.up.outcome != 'skipped' }}
        timeout-minutes: 10
        run: |
          mkdir -p diag
          export KUBECONFIG=$HOME/.kube/ai-platform
          k() { kubectl --request-timeout=30s "$@"; }
          k get nodes -o wide > diag/nodes.txt 2>&1 || true
          k get pods -A -o wide > diag/pods.txt 2>&1 || true
          k get events -A --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          k describe pods -n vllm > diag/vllm-pods.txt 2>&1 || true
          k logs -n vllm deployment/vllm -c vllm --tail=300 > diag/vllm-log.txt 2>&1 || true
          k get scaledobject,hpa -n vllm -o yaml > diag/autoscaling.yaml 2>&1 || true
          k describe pods -n gateway > diag/gateway-pods.txt 2>&1 || true
          for d in litellm postgres presidio-analyzer presidio-anonymizer otel-collector; do
            k logs -n gateway "deployment/$d" --all-containers --tail=300 > "diag/gateway-$d-log.txt" 2>&1 || true
            # A container that was restarted (session 3: a Presidio start that hung) left its log here.
            k logs -n gateway "deployment/$d" --all-containers --previous --tail=300 > "diag/gateway-$d-previous-log.txt" 2>&1 || true
          done
          k describe pods -n monitoring > diag/monitoring-pods.txt 2>&1 || true
          for w in deployment/prometheus-grafana statefulset/tempo statefulset/prometheus-prometheus-kube-prometheus-prometheus \
                   statefulset/alertmanager-prometheus-kube-prometheus-alertmanager; do
            k logs -n monitoring "$w" --all-containers --tail=200 > "diag/monitoring-${w#*/}-log.txt" 2>&1 || true
          done
          k get prometheusrules,servicemonitors,podmonitors -A > diag/monitoring-objects.txt 2>&1 || true
          # Every alert the receiver got, so a run cut off mid-game-day keeps its alert times (P3's session 2 didn't).
          k exec -n monitoring deployment/alert-receiver -- python3 -c \
            'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8080/log").read().decode())' \
            > diag/alerts.jsonl 2>&1 || true
          # P3's GPU check reads GKE's DCGM exporter: its pod spec (labels, ports, hostNetwork) and any
          # NetworkPolicy in its namespace, in case the scrape failed.
          k get pods -n gke-managed-system -o yaml > diag/gke-managed-system-pods.yaml 2>&1 || true
          k get networkpolicies -n gke-managed-system -o yaml > diag/gke-managed-system-netpol.yaml 2>&1 || true
          k top pods -A > diag/top-pods.txt 2>&1 || true
          k describe nodes | grep -A 12 'Allocated resources' > diag/node-allocations.txt 2>&1 || true
          helm list -A > diag/helm.txt 2>&1 || true
          number=$(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')
          [ -n "$PROJECT_ID" ] && [ -n "$number" ]
          sed -i -E "s/$PROJECT_ID/<project>/g; s/$number/<project-number>/g; s/[[:alnum:]._+-]+@[[:alnum:].-]+/<email>/g; s/sk-[[:alnum:]_.-]{4,}/sk-<redacted>/g" diag/*

      # Only after a successful scrub.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() && steps.diag.outcome == 'success' }}
        timeout-minutes: 3  # a few text files; obs-full's time budget counts on it
        with:
          name: ${{ startsWith(inputs.mode, 'gateway-') && 'p2' || startsWith(inputs.mode, 'obs-') && 'p3' || 'p1' }}-${{ inputs.mode }}-diagnostics
          path: diag/
          retention-days: 14
          if-no-files-found: ignore

      # Last, after the diagnostics read vLLM: the GPU node goes now, not when teardown deletes the cluster. vLLM
      # is held at 0 replicas first, so no pending pod makes the autoscaler add a GPU node back. The steps after
      # the deadline end by minute 218 (195 + upload 5 + diagnostics 10 + artifact 3 + this 5), inside the 225 limit.
      - name: "obs-full: GPU pool to 0 nodes"
        if: ${{ always() && steps.up.outcome == 'success' && inputs.mode == 'obs-full' }}
        timeout-minutes: 5
        run: |
          k() { kubectl --kubeconfig "$HOME/.kube/ai-platform" --request-timeout=30s "$@"; }
          k annotate scaledobject vllm -n vllm autoscaling.keda.sh/paused-replicas=0 --overwrite || true
          k scale deployment/vllm -n vllm --replicas=0 || true
          gcloud container clusters resize ai-platform --location="$ZONE" --node-pool=gpu --num-nodes=0 --quiet

  # Its own job and time limit: it runs in full after the session job ends, however it ends.
  # Skipped only when the session job found someone else's cluster (started=no).
  teardown:
    needs: session
    if: ${{ always() && needs.session.outputs.started != 'no' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      ZONE: ${{ inputs.zone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 587.0.0
          install_components: gke-gcloud-auth-plugin

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: install helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: gcloud configuration
        run: |
          gcloud config configurations create ai-platform
          gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
          gcloud config set project "$PROJECT_ID"

      # If make down fails, gcloud still deletes the cluster and the NAT router so the bill stops, and
      # a second make down (now "no cluster") clears Terraform state. The run stays red. If Terraform's
      # state is still locked (make up was killed mid-apply), that second down fails too; make status
      # then shows what is left. P1 creates no PVCs (CI fails a chart that renders one).
      - name: make down
        run: |
          make down || {
            gcloud container clusters delete ai-platform --location="$ZONE" --quiet || true
            gcloud compute routers delete ai-platform-nat --region="${ZONE%-*}" --quiet || true
            make down
            exit 1
          }

      - name: make status
        if: always()
        run: make status
