# Manual session: make up -> make down -> make status, as the deployer service account.
# Runs from main only: the WIF provider trusts no other branch. Down always runs once up started.
name: gpu-session

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# cost-guard shares this group, so it never destroys a cluster a session is still using.
concurrency:
  group: session
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  session:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: deployer@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 587.0.0
          install_components: gke-gcloud-auth-plugin

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      # The Makefile uses the `ai-platform` gcloud configuration, as on the laptop.
      - name: gcloud configuration
        run: |
          gcloud config configurations create ai-platform
          gcloud config set project "$PROJECT_ID"

      # A cluster that already exists belongs to someone else (e.g. a laptop session); leave it alone.
      - name: stop if a cluster exists
        id: precheck
        run: |
          clusters=$(gcloud container clusters list --format='value(name)')
          if [ -n "$clusters" ]; then echo "a session cluster already exists; not starting another"; exit 1; fi

      - name: make up
        timeout-minutes: 40
        run: make up

      - name: make down
        if: always() && steps.precheck.outcome == 'success'
        run: make down

      - name: make status
        if: always()
        run: make status
