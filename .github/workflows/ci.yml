# Lint and scan every pull request to main. No cloud login: the WIF provider trusts only main.
# Linters run as pinned Docker images, the same commands as on the laptop.
name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive infra/

      - name: terraform validate
        run: |
          for root in infra/foundation infra/session; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done

      - name: tflint
        run: docker run --rm -v "$PWD:/data" ghcr.io/terraform-linters/tflint:v0.64.0@sha256:1c595f42d794c32c45a6ea8b58655fd66433d4ca3b1bc631c574a48d120bd19f --recursive

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0@sha256:61862eba1fcf09a484ebcc6feea46f1782532571a34ed51fedf90dd25f925a8d

      - name: ruff
        run: docker run --rm -v "$PWD:/io" -w /io ghcr.io/astral-sh/ruff:0.16.9@sha256:fd4a00e8f586c07495822a1c93702737b9a98d826b76d460caa514df7794f259 check .

      # Standard library only, so the runner's Python needs nothing installed.
      # Every folder with test_*.py. Tests that need a session cluster skip themselves.
      - name: unit tests
        run: |
          for d in $(git ls-files '*test_*.py' | xargs -n1 dirname | sort -u); do
            python3 -m unittest discover -s "$d" -v
          done

      - name: install helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: helm charts (lint, schema check, no public services or disks)
        run: |
          for c in projects/*/tests/charts.sh; do echo "== $c"; "$c"; done

      - name: "P3: SLO and alert rules (Sloth's output is committed, promtool checks and unit tests)"
        run: projects/03-llm-observability/tests/rules.sh

      - name: the charts package with one version (what release.yml does on a tag)
        run: |
          scripts/package_charts.sh "$(sed -n 's/^version: //p' projects/02-llm-gateway/helm/gateway/Chart.yaml)" "$RUNNER_TEMP/charts"

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # trivy-action is not used: its tags were hijacked in March 2026 (CVE-2026-33634).
      - name: trivy config scan
        run: docker run --rm -v "$PWD:/src:ro" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa config --exit-code 1 --severity HIGH,CRITICAL /src/infra

  # P2: the gateway in containers (projects/02-llm-gateway/tests/compose.yaml), with the chart's own
  # LiteLLM config and start script and the mock provider in place of vLLM and the hosted model.
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 25  # two Presidio waits of 8 min, plus the rest (a green run takes about 4 min in all)
    defaults:
      run:
        working-directory: projects/02-llm-gateway/tests
    env:
      YQ: mikefarah/yq:4.54.1@sha256:4b3d9475d65571d28cbb19544d3820ec2945e4c8b2f18279394282b8dc3a592e
      GATEWAY_URL: http://127.0.0.1:4000
      MOCK_HOSTED_URL: http://127.0.0.1:8102  # what reached the "hosted provider" (test_pii.py)
      TEMPO_URL: http://127.0.0.1:3200  # P3's test_metrics.py
      PROMETHEUS_URL: http://127.0.0.1:9090
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          echo "$RUNNER_TEMP/linux-amd64" >> "$GITHUB_PATH"

      - name: the containers use the chart's images
        run: |
          for key in .litellm.image .postgres.image .presidio.analyzer.image .presidio.anonymizer.image; do
            image=$(docker run --rm -i "$YQ" "$key" < ../helm/gateway/values.yaml)
            grep -qxF "    image: $image" compose.yaml || { echo "compose.yaml doesn't use $key ($image)"; exit 1; }
          done
          otel=$(docker run --rm -i "$YQ" '.image.repository + ":" + .image.tag + "@" + .image.digest' < ../helm/otel-collector.yaml)
          grep -qxF "    image: $otel" compose.yaml || { echo "compose.yaml doesn't use the collector image ($otel)"; exit 1; }

      - name: CI's chat-default and chat-hosted have the chart's timeouts (and chat-default its price)
        run: |
          q='.config.model_list[] | select(.model_name == "chat-default") | .litellm_params | [.timeout, .stream_timeout, .input_cost_per_token, .output_cost_per_token]'
          h='.config.model_list[] | select(.model_name == "chat-hosted") | .litellm_params | [.timeout, .stream_timeout]'
          for query in "$q" "$h"; do
            chart=$(docker run --rm -i "$YQ" -o=json "$query" < ../helm/gateway/values.yaml)
            ci=$(docker run --rm -i "$YQ" -o=json "$query" < ../helm/gateway/values-ci.yaml)
            [ -n "$chart" ] && [ "$chart" != null ] || { echo "no match in values.yaml for: $query"; exit 1; }
            [ "$chart" = "$ci" ] || { echo "values-ci.yaml differs from values.yaml: $ci vs $chart"; exit 1; }
            echo "timeouts (and chat-default's prices): $chart"
          done

      - name: random secrets as files, the chart's config rendered
        run: |
          secrets="$RUNNER_TEMP/secrets" config="$RUNNER_TEMP/config"
          mkdir -p "$secrets" "$config"
          master="sk-$(openssl rand -hex 24)"; pg=$(openssl rand -hex 16)
          echo "::add-mask::$master"; echo "::add-mask::$pg"
          printf '%s' "$master" > "$secrets/litellm-master-key"
          printf '%s' "$pg" > "$secrets/gateway-postgres-password"
          helm template gateway ../helm/gateway -f ../helm/gateway/values-ci.yaml --set project=ci \
            --set labels.owner=ci --set labels.session=ci --show-only templates/config.yaml > "$RUNNER_TEMP/cm.yaml"
          docker run --rm -i "$YQ" '.data["config.yaml"]' < "$RUNNER_TEMP/cm.yaml" > "$config/config.yaml"
          docker run --rm -i "$YQ" '.data["start.sh"]' < "$RUNNER_TEMP/cm.yaml" > "$config/start.sh"
          { echo "SECRETS_DIR=$secrets"; echo "CONFIG_DIR=$config"; echo "MASTER_KEY=$master"; } >> "$GITHUB_ENV"

      # P3's override (compose.p3.yaml): the collector's and Tempo's configs come from their charts with P2's
      # and P3's values, so CI runs the cluster's pipeline. CI's own values add full span printing and a span
      # file. Every compose command below uses both compose files.
      - name: "P3: collector and Tempo configs from their charts, and the span file"
        run: |
          p3=../../03-llm-observability
          spans="$RUNNER_TEMP/spans" otel="$RUNNER_TEMP/otel" tempo="$RUNNER_TEMP/tempo"
          mkdir "$spans" "$otel" "$tempo"
          helm template otel-collector opentelemetry-collector --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
            --version 0.174.2 -n gateway -f ../helm/otel-collector.yaml -f "$p3/helm/otel-collector.yaml" \
            -f "$p3/tests/otel-ci-values.yaml" --show-only templates/configmap.yaml \
            | docker run --rm -i "$YQ" '.data.relay' > "$otel/relay.yaml"
          helm template tempo tempo --repo https://grafana-community.github.io/helm-charts --version 3.1.0 -n monitoring \
            -f "$p3/helm/tempo.yaml" --show-only templates/configmap-tempo.yaml > "$RUNNER_TEMP/tempo-cm.yaml"
          for f in tempo.yaml overrides.yaml; do
            docker run --rm -i "$YQ" ".data[\"$f\"]" < "$RUNNER_TEMP/tempo-cm.yaml" > "$tempo/$f"
          done
          { echo "SPANS_DIR=$spans"; echo "SPANS_FILE=$spans/spans.jsonl"; echo "SPANS_UID=$(id -u)"
            echo "OTEL_CONFIG=$otel/relay.yaml"; echo "TEMPO_CONFIG_DIR=$tempo"
            echo "COMPOSE_FILE=compose.yaml:$p3/tests/compose.p3.yaml"; } >> "$GITHUB_ENV"

      # Presidio (the tool that finds personal data) hung at start in 4 of 7 runs on 2026-10-20. The hung
      # anonymizer's log shows gunicorn 25.1.0 up with its control socket open but no worker booted, which
      # matches gunicorn issues 3509 and 3529; compose.yaml and the chart now turn that socket off (not yet
      # proven to fix it). Healthy starts took 51 to 300 s in 23 CI runs, so wait 8 min; if one still hangs,
      # print its last log lines, restart it once and wait 8 min more. In the cluster the startup probe does
      # the restart.
      - name: start the gateway
        run: |
          docker compose up -d --wait --wait-timeout 480 && exit 0
          for s in presidio-analyzer presidio-anonymizer; do
            health=$(docker compose ps "$s" --format '{{.Health}}')
            [ "$health" = healthy ] && continue
            echo "::warning::$s was $health; its last log lines, then one restart"
            docker compose logs --no-color --timestamps --tail 40 "$s"
            docker compose restart "$s"
          done
          docker compose up -d --wait --wait-timeout 480

      - name: smoke, budget, rate limit, keys, PII on the hosted route
        run: python3 -m unittest discover -s . -v

      # The span names and attributes P3's metrics, alerts and scale-from-zero trigger are built on, then the
      # pipeline: a trace in Tempo, the span metrics in Prometheus, data for every gateway dashboard query,
      # and cost per team from the traces equal to the spend logs. The span test's fallback request is the
      # first after the mock vLLM stops, so it also checks that one comes within the 30 s timeout.
      - name: "P3: span contract, Tempo, span metrics, dashboards, cost (stops the mock vLLM for the next step)"
        working-directory: projects/03-llm-observability/tests
        run: python3 -m unittest -v test_spans test_metrics test_dashboards test_cost

      - name: fallback, and PII on the fallback (the mock vLLM stopped)
        run: |
          docker compose stop mock-vllm
          VLLM_DOWN=1 python3 -m unittest test_fallback test_pii -v

      # Container logs go to Cloud Logging on GKE, so they must not hold a prompt either.
      - name: no raw PII in logs, traces or spend logs
        run: |
          dump="$RUNNER_TEMP/pii-dump.txt"
          sleep 15  # LiteLLM writes spend logs in batches
          rows=$(docker compose exec -T postgres psql -U litellm -d litellm -Atc 'select count(*) from "LiteLLM_SpendLogs"')
          echo "spend-log rows: $rows"
          [ "$rows" -gt 0 ] || { echo "no spend-log rows yet: nothing to check"; exit 1; }
          docker compose logs --no-color litellm otel-collector presidio-analyzer presidio-anonymizer > "$dump"
          docker compose exec -T postgres psql -U litellm -d litellm -Atc 'select row_to_json(t) from "LiteLLM_SpendLogs" t' >> "$dump"
          echo "dump: $(wc -l < "$dump") lines"
          PII_DUMP_FILE="$dump" python3 -m unittest test_pii.NoRawPiiInLogs -v

      - name: fail closed (the PII analyzer stopped)
        run: |
          docker compose stop presidio-analyzer
          PRESIDIO_DOWN=1 python3 -m unittest test_pii.FailClosed -v

      - name: container logs (keys scrubbed)
        if: failure()
        run: docker compose logs --no-color | sed -E 's/sk-[A-Za-z0-9_.-]{4,}/sk-<redacted>/g' | tail -200

  # P5: the action gateway image, built and scanned; the unit tests inside it (they need the MCP SDK, which
  # the lint job's unit-test step doesn't install); then the kind smoke test (tests/kind-smoke.sh). No cloud.
  action-gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/05-agent-action-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build the image
        run: docker build -t action-gateway:ci .

      # Fails on HIGH or CRITICAL findings that have a fix; unfixed ones can't be acted on here.
      - name: scan the image (trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL action-gateway:ci

      - name: unit tests inside the image (read-only root filesystem, as in the pod)
        run: docker run --rm --read-only --tmpfs /tmp action-gateway:ci python -m unittest discover -s /app -v

      - name: install kind and kubectl (pinned, checked by sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  $RUNNER_TEMP/kind" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl
          echo "8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a  $RUNNER_TEMP/kubectl" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kind" "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: kind smoke test (get_status, a dry run, the write tools and undo as the scoped ServiceAccount; CLI approval)
        run: tests/kind-smoke.sh
